[package]
name = "sunset"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Editor de fotos mínimo em Rust, no espírito do módulo Revelação do Lightroom."

[dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "wgpu",
    "wayland",
    "x11",
    "default_fonts",
] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rayon = "1.10"
rfd = "0.15"
toml = "0.8"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
